name: Release

# Pushing a version tag (vX.Y.Z) builds the package, uploads it to PyPI as mcp-guard-gateway and creates the
# GitHub release. Uses PyPI trusted publishing: no API token is stored in the repo.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version in pyproject.toml matches the release tag
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "pyproject version v$v != tag ${GITHUB_REF_NAME}"; exit 1; }
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          name: MCP Guard ${{ github.ref_name }}
          files: dist/*
          body: |
            Security gateway for AI agents and MCP tool servers.

            **Install:** `pip install mcp-guard-gateway` or `docker pull ghcr.io/hardikbahri/mcp-guard:${{ github.ref_name }}`

            **Quickstart:** `mcp-guard init --upstream "<your MCP server>"`, review `mcp-guard.yaml`
            ([policy reference](https://github.com/hardikbahri/mcp-guard/blob/main/docs/policy.md)), `mcp-guard check`,
            then point your MCP client at `mcp-guard proxy`.
