name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit, API and proxy tests (includes the attack suite)
        run: pytest -v
      - name: Attack suite is up to date
        run: |
          python attacks/build_cases.py
          git diff --exit-code attacks/cases.jsonl

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t mcp-guard:ci .
      - name: API container starts and answers
        run: |
          docker run -d --name guard -p 8080:8080 mcp-guard:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/healthz | grep -q classify_complaint
          SID=$(curl -fs -X POST http://127.0.0.1:8080/v1/sessions -H 'content-type: application/json' \
                -d '{"user":"triage-bot"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["session_id"])')
          curl -fs -X POST http://127.0.0.1:8080/v1/sessions/$SID/check-call -H 'content-type: application/json' \
               -d '{"tool":"notify_customer","arguments":{"email":"a@b.com","message":"hi"}}' | grep -q '"action":"block"'
      - name: Container runs as a non-root user
        run: test "$(docker exec guard id -u)" != "0"
      - name: Logs on failure
        if: failure()
        run: docker logs guard || true

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Build the sandbox image
        run: docker build -f Dockerfile.sandbox -t mcp-guard-sandbox:demo .
      - name: Compromised server, without and with the sandbox
        run: python demo/sandbox_demo.py
      - name: Sandbox tests against a real container
        run: pytest -v tests/test_sandbox.py
      - name: Results
        if: always()
        run: cat demo/sandbox_results.md >> "$GITHUB_STEP_SUMMARY" || true

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package into a clean environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install .
      - name: Quickstart outside the repo
        working-directory: /tmp
        run: |
          export PATH=/tmp/venv/bin:$PATH
          mkdir onboarding && cd onboarding
          mcp-guard init --upstream "python -m demo.complaint_server"
          mcp-guard check --upstream "python -m demo.complaint_server"
          grep -q "egress: external" mcp-guard.yaml
